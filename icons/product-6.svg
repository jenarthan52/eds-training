<svg xmlns="http://www.w3.org/2000/svg" viewBox="175 130 250 515" width="100%" height="100%">
  <defs>
    <!-- Soft Base Shadow -->
    <radialGradient id="mockupShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Matte Black Jar Body Gradient -->
    <linearGradient id="matteBlackJar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#101114"/>
      <stop offset="8%" stop-color="#282a30"/>
      <stop offset="22%" stop-color="#444953"/>
      <stop offset="42%" stop-color="#1e2025"/>
      <stop offset="76%" stop-color="#3d424c"/>
      <stop offset="92%" stop-color="#202227"/>
      <stop offset="100%" stop-color="#0e0f12"/>
    </linearGradient>

    <!-- Dark Matte Cap Gradient -->
    <linearGradient id="matteCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141518"/>
      <stop offset="15%" stop-color="#33363e"/>
      <stop offset="35%" stop-color="#4a4f5b"/>
      <stop offset="55%" stop-color="#212328"/>
      <stop offset="80%" stop-color="#383c45"/>
      <stop offset="95%" stop-color="#1f2025"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>

    <!-- Chrome Silver Gradient for "WHEY" -->
    <linearGradient id="wheySilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f2f5"/>
      <stop offset="80%" stop-color="#c5cbd3"/>
      <stop offset="100%" stop-color="#808791"/>
    </linearGradient>

    <!-- Coral / Orange-Red Accent -->
    <linearGradient id="coralAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f85646"/>
      <stop offset="100%" stop-color="#d43929"/>
    </linearGradient>

    <!-- Subtle Label Background Gradient -->
    <linearGradient id="labelCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#151619"/>
      <stop offset="15%" stop-color="#2c2e35"/>
      <stop offset="35%" stop-color="#373a43"/>
      <stop offset="65%" stop-color="#22242a"/>
      <stop offset="90%" stop-color="#33363e"/>
      <stop offset="100%" stop-color="#17181c"/>
    </linearGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="300" cy="635" rx="108" ry="9" fill="url(#mockupShadow)"/>

  <!-- Bottle Neck Under Cap -->
  <rect x="236" y="196" width="128" height="24" rx="4" fill="#15161a"/>
  <ellipse cx="300" cy="216" rx="64" ry="6" fill="#2c2f37"/>

  <!-- Main Matte Jar Body -->
  <path d="M 188 310 C 188 238, 222 222, 260 222 L 340 222 C 378 222, 412 238, 412 310 L 412 570 C 412 622, 382 638, 342 638 L 258 638 C 218 638, 188 622, 188 570 Z" fill="url(#matteBlackJar)"/>

  <!-- Shoulder Soft Light Reflection -->
  <path d="M 205 300 C 215 240, 246 228, 300 228" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.18"/>
  <ellipse cx="300" cy="229" rx="68" ry="7" fill="#ffffff" opacity="0.06"/>

  <!-- ==================== LABEL SECTION START ==================== -->
  <!-- Label Background Surface -->
  <rect x="188" y="315" width="224" height="258" fill="url(#labelCylinder)"/>

  <!-- Top & Bottom Subtle Label Grooves/Margins -->
  <line x1="188" y1="315" x2="412" y2="315" stroke="#ffffff" stroke-width="0.8" opacity="0.12"/>
  <line x1="188" y1="573" x2="412" y2="573" stroke="#000000" stroke-width="1.2" opacity="0.4"/>

  <!-- Left Coral / Orange-Red Vertical Accent Bar -->
  <rect x="200" y="380" width="11" height="126" rx="1.5" fill="url(#coralAccent)"/>

  <!-- Subtitle: PSD-MOCKUP -->
  <text x="300" y="356" 
        font-family="-apple-system, BlinkMacSystemFont, 'Arial', sans-serif" 
        font-size="13" 
        font-weight="600" 
        letter-spacing="5.5" 
        fill="#ffffff" 
        text-anchor="middle" 
        opacity="0.88">PSD-MOCKUP</text>

  <!-- Title 1: WHEY (Bold Metallic Silver) -->
  <text x="300" y="442" 
        font-family="-apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" 
        font-size="52" 
        font-weight="900" 
        letter-spacing="2" 
        fill="url(#wheySilver)" 
        text-anchor="middle">WHEY</text>

  <!-- Title 2: PROTEIN (Bright Coral Red) -->
  <text x="300" y="482" 
        font-family="-apple-system, BlinkMacSystemFont, 'Arial', sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="4.5" 
        fill="url(#coralAccent)" 
        text-anchor="middle">PROTEIN</text>

  <!-- Nutritional Stats Group -->
  <!-- 1. 22g PROTEIN -->
  <g transform="translate(250, 520)">
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">22g</text>
    <text x="0" y="9" font-family="'Arial', sans-serif" font-size="6" font-weight="700" fill="#ff4d3d" text-anchor="middle" letter-spacing="0.4">PROTEIN</text>
  </g>

  <!-- Divider 1 -->
  <line x1="266" y1="508" x2="266" y2="530" stroke="#7a808c" stroke-width="1.2" opacity="0.7"/>

  <!-- 2. 5.5g BCAAS -->
  <g transform="translate(292, 520)">
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5.5g</text>
    <text x="0" y="9" font-family="'Arial', sans-serif" font-size="6" font-weight="700" fill="#ff4d3d" text-anchor="middle" letter-spacing="0.4">BCAAS</text>
  </g>

  <!-- Divider 2 -->
  <line x1="318" y1="508" x2="318" y2="530" stroke="#7a808c" stroke-width="1.2" opacity="0.7"/>

  <!-- 3. 3.5g GLUTAMINE -->
  <g transform="translate(348, 520)">
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3.5g</text>
    <text x="0" y="9" font-family="'Arial', sans-serif" font-size="6" font-weight="700" fill="#ff4d3d" text-anchor="middle" letter-spacing="0.4">GLUTAMINE</text>
  </g>

  <!-- Small Placeholder Paragraph Text -->
  <g fill="#9ea5b3" font-family="'Arial', sans-serif" font-size="4.2" opacity="0.7" text-anchor="middle">
    <text x="300" y="546">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do</text>
    <text x="300" y="552">eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim</text>
    <text x="300" y="558">ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut</text>
  </g>

  <!-- NET WT 2,2LBS (1 Kg) -->
  <text x="300" y="594" 
        font-family="-apple-system, BlinkMacSystemFont, 'Arial', sans-serif" 
        font-size="6.8" 
        font-weight="700" 
        letter-spacing="0.5" 
        fill="#ffffff" 
        text-anchor="middle" 
        opacity="0.85">NET WT 2,2LBS (1 Kg)</text>
  <!-- ===================== LABEL SECTION END ===================== -->

  <!-- Plastic Surface Cylindrical Gloss -->
  <path d="M 191 330 L 191 580" stroke="#ffffff" stroke-width="4" opacity="0.14" stroke-linecap="round"/>
  <path d="M 409 330 L 409 580" stroke="#ffffff" stroke-width="2.5" opacity="0.08" stroke-linecap="round"/>

  <!-- Bottom Rim Highlight Curve -->
  <path d="M 215 630 Q 300 642 385 630" stroke="#4a505b" stroke-width="2.8" fill="none" opacity="0.55"/>

  <!-- ==================== MATTE BLACK CAP ==================== -->
  <!-- Cap Top Oval -->
  <ellipse cx="300" cy="148" rx="82" ry="11" fill="#383c45"/>
  <ellipse cx="300" cy="146" rx="80" ry="9.5" fill="#1b1c20"/>

  <!-- Cap Cylindrical Body -->
  <path d="M 218 148 L 218 206 C 218 214, 382 214, 382 206 L 382 148 Z" fill="url(#matteCap)"/>

  <!-- Cap Top/Bottom Bevel Seams -->
  <ellipse cx="300" cy="155" rx="81" ry="8" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.1"/>
  
  <!-- Cap Specular Highlight -->
  <rect x="242" y="148" width="22" height="60" fill="#ffffff" opacity="0.06"/>
  <rect x="338" y="148" width="16" height="60" fill="#ffffff" opacity="0.04"/>

  <!-- Cap Bottom Lip Touching Jar -->
  <path d="M 219 203 C 219 212, 381 212, 381 203" stroke="#0b0c0e" stroke-width="2.5" fill="none"/>
  <path d="M 219 205 C 219 213, 381 213, 381 205" stroke="#484d58" stroke-width="0.8" fill="none" opacity="0.4"/>
</svg>
